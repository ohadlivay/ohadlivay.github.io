<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Entropy - LLM Diversity Challenge</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
    }

    #root {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Lucide icon components (simplified)
    const Sparkles = ({ className, size = 24 }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 3L14.5 8.5L20 11L14.5 13.5L12 19L9.5 13.5L4 11L9.5 8.5L12 3Z" />
        <path d="M20 3v4" />
        <path d="M22 5h-4" />
        <path d="M4 17v2" />
        <path d="M5 18H3" />
      </svg>
    );

    const Trophy = ({ className, size = 24 }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
        <path d="M4 22h16" />
        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
      </svg>
    );

    const Zap = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
      </svg>
    );

    const Apple = ({ className }) => (
      <svg className={className} width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z" />
        <path d="M10 2c1 .5 2 2 2 5" />
      </svg>
    );

    function FruitEntropy() {
      const [apiKey, setApiKey] = useState('');
      const [prompt, setPrompt] = useState('');
      const [isRunning, setIsRunning] = useState(false);
      const [score, setScore] = useState(null);
      const [fruits, setFruits] = useState([]);
      const [leaderboard, setLeaderboard] = useState([]);
      const [error, setError] = useState('');
      const [progress, setProgress] = useState(0);

      // Load from localStorage on mount
      useEffect(() => {
        loadLeaderboard();
        loadApiKey();
      }, []);

      const loadApiKey = () => {
        try {
          const saved = localStorage.getItem('openrouter_api_key');
          if (saved) {
            setApiKey(saved);
          }
        } catch (err) {
          console.log('No saved API key');
        }
      };

      const saveApiKey = (key) => {
        try {
          if (key.trim()) {
            localStorage.setItem('openrouter_api_key', key.trim());
          }
        } catch (err) {
          console.log('Error saving API key:', err);
        }
      };

      const loadLeaderboard = () => {
        try {
          const saved = localStorage.getItem('fruit_leaderboard');
          if (saved) {
            const entries = JSON.parse(saved);
            entries.sort((a, b) => b.score - a.score);
            setLeaderboard(entries.slice(0, 10));
          }
        } catch (err) {
          console.log('Leaderboard loading error:', err);
        }
      };

      const saveToLeaderboard = (entry) => {
        try {
          const saved = localStorage.getItem('fruit_leaderboard');
          const entries = saved ? JSON.parse(saved) : [];
          entries.push(entry);
          entries.sort((a, b) => b.score - a.score);
          localStorage.setItem('fruit_leaderboard', JSON.stringify(entries.slice(0, 50)));
          loadLeaderboard();
        } catch (err) {
          console.log('Error saving to leaderboard:', err);
        }
      };

      const KNOWN_FRUITS = new Set([
        'apple', 'apricot', 'avocado', 'banana', 'blackberry', 'blueberry',
        'boysenberry', 'cherry', 'clementine', 'coconut', 'cranberry', 'cucumber',
        'currant', 'date', 'dragonfruit', 'durian', 'elderberry', 'fig', 'gooseberry',
        'grape', 'grapefruit', 'guava', 'honeydew', 'jackfruit', 'kiwi', 'kumquat',
        'lemon', 'lime', 'lychee', 'mandarin', 'mango', 'mangosteen', 'melon',
        'mulberry', 'nectarine', 'orange', 'papaya', 'passionfruit', 'peach', 'pear',
        'persimmon', 'pineapple', 'plum', 'pomegranate', 'pomelo', 'quince', 'raspberry',
        'rambutan', 'starfruit', 'strawberry', 'tangerine', 'watermelon'
      ]);

      const validateFruit = (text) => {
        const normalized = text.toLowerCase().trim().replace(/[^a-z]/g, '');
        return KNOWN_FRUITS.has(normalized) ? normalized : null;
      };

      const runEntropy = async () => {
        if (!apiKey.trim()) {
          setError('Please enter your OpenRouter API key');
          return;
        }

        if (!prompt.trim()) {
          setError('Please enter a prompt');
          return;
        }

        setIsRunning(true);
        setError('');
        setScore(null);
        setFruits([]);
        setProgress(0);

        try {
          const BATCH_SIZE = 1;
          const NUM_CALLS = 5;
          const BATCH_DELAY = 10000; // 10 seconds between batches
          const allFruits = [];

          for (let batch = 0; batch < NUM_CALLS / BATCH_SIZE; batch++) {
            // Add delay between batches (except first one)
            if (batch > 0) {
              await new Promise(resolve => setTimeout(resolve, BATCH_DELAY));
            }

            const promises = Array(BATCH_SIZE).fill(0).map(() =>
              fetch("https://cors-anywhere.herokuapp.com/https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${apiKey.trim()}`,
                  "HTTP-Referer": window.location.href,
                  "X-Title": "Fruit Entropy"
                },
                body: JSON.stringify({
                  model: "meta-llama/llama-3.2-3b-instruct:free",
                  messages: [{
                    role: "user",
                    content: `${prompt}\n\nRespond with ONLY a single fruit name, nothing else.`
                  }],
                  temperature: 1.0,
                  max_tokens: 50
                })
              })
                .then(async res => {
                  const text = await res.text();
                  console.log('API Response:', text);

                  if (!res.ok) {
                    console.error('API error:', res.status, res.statusText, text);
                    let errorMsg = `API returned ${res.status}`;
                    try {
                      const errorData = JSON.parse(text);
                      errorMsg += `: ${errorData.error?.message || text}`;
                    } catch {
                      errorMsg += `: ${text}`;
                    }
                    throw new Error(errorMsg);
                  }

                  const data = JSON.parse(text);
                  if (data.error) {
                    console.error('OpenRouter API error:', data.error);
                    throw new Error(data.error.message || JSON.stringify(data.error));
                  }
                  if (data.choices && data.choices[0] && data.choices[0].message) {
                    return data.choices[0].message.content.trim();
                  }
                  return null;
                })
                .catch(err => {
                  console.error('Fetch error:', err.message);
                  throw err;
                })
            );

            const batchResults = await Promise.all(promises.map(p => p.catch(e => null)));
            const successfulResults = batchResults.filter(r => r !== null);
            allFruits.push(...successfulResults);
            setProgress(((batch + 1) * BATCH_SIZE / NUM_CALLS) * 100);
          }

          // Check if we got any responses at all
          if (allFruits.length === 0) {
            setError('No responses received from API. Common issues: 1) Invalid API key format (should start with sk-or-v1-), 2) Need to add payment method on OpenRouter (even for free tier), 3) Insufficient credits. Check browser console (F12) for detailed error messages.');
            return;
          }

          // Validate and deduplicate
          const validFruits = allFruits
            .map(validateFruit)
            .filter(f => f !== null);

          const uniqueFruits = [...new Set(validFruits)];
          const finalScore = uniqueFruits.length;

          setFruits(uniqueFruits);
          setScore(finalScore);

          // Save to leaderboard
          if (finalScore > 0) {
            const entry = {
              score: finalScore,
              prompt: prompt.trim(),
              timestamp: Date.now(),
              fruitCount: validFruits.length,
              uniqueCount: finalScore
            };

            saveToLeaderboard(entry);
          }

        } catch (err) {
          setError('Error running entropy test: ' + err.message);
        } finally {
          setIsRunning(false);
          setProgress(0);
        }
      };

      return (
        <div className="fruit-entropy">
          <div className="cosmic-bg"></div>
          <div className="noise-overlay"></div>

          <div className="container">
            <header className="header">
              <div className="logo-container">
                <Apple className="logo-icon" />
                <h1 className="title">
                  <span className="title-fruit">Fruit</span>
                  <span className="title-entropy">Entropy</span>
                </h1>
              </div>
              <p className="subtitle">
                Maximize diversity. Challenge an LLM to generate 50 unique fruits.
              </p>
            </header>

            <div className="main-content">
              <div className="api-key-section">
                <label htmlFor="api-key" className="api-key-label">
                  OpenRouter API Key
                  <a
                    href="https://openrouter.ai/keys"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="api-key-link"
                  >
                    Get free key →
                  </a>
                </label>
                <input
                  id="api-key"
                  type="password"
                  value={apiKey}
                  onChange={(e) => {
                    setApiKey(e.target.value);
                    saveApiKey(e.target.value);
                  }}
                  placeholder="sk-or-v1-..."
                  className="api-key-input"
                />
                <div className="hosting-note">
                  ✨ Using OpenRouter with free Llama 3.2 model. Requests are throttled to avoid rate limits (~20 seconds total).
                </div>
              </div>

              <div className="input-section">
                <div className="input-wrapper">
                  <Sparkles className="input-icon" />
                  <input
                    type="text"
                    value={prompt}
                    onChange={(e) => setPrompt(e.target.value)}
                    onKeyPress={(e) => e.key === 'Enter' && !isRunning && runEntropy()}
                    placeholder="Enter your fruit prompt..."
                    disabled={isRunning}
                    className="prompt-input"
                  />
                </div>

                <button
                  onClick={runEntropy}
                  disabled={isRunning || !prompt.trim() || !apiKey.trim()}
                  className="run-button"
                >
                  {isRunning ? (
                    <>
                      <div className="spinner"></div>
                      Running... {Math.round(progress)}%
                    </>
                  ) : (
                    <>
                      <Zap size={20} />
                      Run Entropy
                    </>
                  )}
                </button>
              </div>

              {error && (
                <div className="error-message">
                  {error}
                </div>
              )}

              {score !== null && (
                <div className="score-reveal">
                  <div className="score-label">Entropy Score</div>
                  <div className="score-value">{score}</div>
                  <div className="score-detail">
                    {fruits.length} unique {fruits.length === 1 ? 'fruit' : 'fruits'} discovered
                  </div>

                  {fruits.length > 0 && (
                    <div className="fruit-cloud">
                      {fruits.sort().map((fruit, i) => (
                        <span key={i} className="fruit-tag" style={{
                          animationDelay: `${i * 0.03}s`
                        }}>
                          {fruit}
                        </span>
                      ))}
                    </div>
                  )}
                </div>
              )}

              <div className="leaderboard">
                <div className="leaderboard-header">
                  <Trophy className="trophy-icon" />
                  <h2>Leaderboard</h2>
                </div>

                {leaderboard.length === 0 ? (
                  <div className="empty-state">
                    Be the first to set a score!
                  </div>
                ) : (
                  <div className="leaderboard-list">
                    {leaderboard.map((entry, index) => (
                      <div key={index} className="leaderboard-item">
                        <div className="rank">#{index + 1}</div>
                        <div className="entry-details">
                          <div className="entry-prompt">{entry.prompt}</div>
                          <div className="entry-meta">
                            {entry.uniqueCount} unique from {entry.fruitCount} responses
                          </div>
                        </div>
                        <div className="entry-score">{entry.score}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>

          <style>{`
            .fruit-entropy {
              min-height: 100vh;
              background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
